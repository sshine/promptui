[workspace]
resolver = "2"
members = ["crates/*", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/promptui"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# Internal crates
promptui-core = { version = "0.1.0", path = "crates/promptui-core" }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Error handling
thiserror = "2"

# Diagnostics
tracing = "0.1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures = "0.3"

# Unicode
unicode-width = "0.2"

# Misc
rand = "0.9"

# Dev dependencies
insta = { version = "1", features = ["yaml"] }
